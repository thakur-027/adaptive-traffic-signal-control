<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 452" width="1200" height="452"
     role="img" aria-label="Average waiting time per vehicle on a 2x2 grid, 1800-second episodes, mean of 10 seeds. Fixed-time, max-pressure and the RL agents across 5 demand levels. Against fixed-time the agents cut waiting time by 27 percent at low demand and 71 percent at rush, where fixed-time reaches 122.8 seconds and the agents 36.0. Against max-pressure the change is plus 3.4 % at low, plus 0.4 % at medium, minus 8.9 % at high, minus 16.9 % at rush, minus 2.9 % at surge.">
  <title>Measured benchmark: waiting time by controller and demand</title>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0f1a33"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="rlbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="452" rx="20" fill="url(#abg)"/>
  <rect width="1200" height="452" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="451" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
